name: 平台 Bug 反馈 (Bug Report)
description: 平台访问异常、页面报错、接口报错等平台本身的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整以下信息，方便我们快速定位处理。
  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 平台访问异常
        - 页面显示 / 按钮异常
        - 接口报错
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请描述发生了什么，以及期望的正确行为
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请附上操作步骤、时间点、相关报错信息或截图（注意不要泄露 Agent Key）
    validations:
      required: true
